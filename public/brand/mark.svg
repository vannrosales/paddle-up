<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF3A" />
      <stop offset="100%" stop-color="#B2E008" />
    </linearGradient>
    <filter id="markShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1C2A00" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="100" height="100" rx="22" fill="#1C1C1E" />
  
  <!-- Paddle silhouette -->
  <path d="M42 22 C30 22 24 30 24 44 C24 56 31 64 42 66 L38 82 C38 84 39.5 86 42 86 C44.5 86 46 84 46 82 L49 66.4 C58 65.5 64 58 64 44 C64 30 58 22 42 22 Z" fill="#2C2C2E" />
  
  <!-- Pickleball icon with perforations -->
  <g filter="url(#markShadow)">
    <circle cx="56" cy="40" r="22" fill="url(#markGrad)" />
    <!-- Perforations -->
    <circle cx="56" cy="31" r="2.8" fill="#1C2A00" fill-opacity="0.75" />
    <circle cx="47" cy="37" r="2.8" fill="#1C2A00" fill-opacity="0.75" />
    <circle cx="65" cy="37" r="2.8" fill="#1C2A00" fill-opacity="0.75" />
    <circle cx="51" cy="47" r="2.8" fill="#1C2A00" fill-opacity="0.75" />
    <circle cx="61" cy="47" r="2.8" fill="#1C2A00" fill-opacity="0.75" />
    <circle cx="56" cy="41" r="1.5" fill="#1C2A00" fill-opacity="0.5" />
  </g>
</svg>

